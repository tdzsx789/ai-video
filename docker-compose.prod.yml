services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-video-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seedance}
      POSTGRES_USER: ${POSTGRES_USER:-seedance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seedance_dev}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:5434}:5432"
    volumes:
      - ai_video_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-seedance} -d $${POSTGRES_DB:-seedance}"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-video-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-seedance}:${POSTGRES_PASSWORD:-seedance_dev}@postgres:5432/${POSTGRES_DB:-seedance}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://121.41.0.15:30081}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-30081}:8787"

volumes:
  ai_video_postgres_data:
