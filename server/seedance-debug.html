<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seedance 视频调试台</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --line: #d7dce2;
      --text: #18202a;
      --muted: #5f6b7a;
      --accent: #165ef0;
      --accent-2: #0f9d58;
      --danger: #c23a3a;
      --shadow: 0 1px 0 rgba(16, 24, 40, 0.04);
      --radius: 6px;
      --mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 24px 8px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-columns: minmax(340px, 460px) minmax(0, 1fr);
      gap: 16px;
      padding: 16px 24px 24px;
      align-items: start;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      min-width: 0;
    }
    .stack {
      display: grid;
      gap: 10px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }
    label {
      font-size: 12px;
      color: var(--muted);
    }
    input, select, textarea, button {
      font: inherit;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
    }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      min-width: 0;
    }
    textarea {
      min-height: 118px;
      resize: vertical;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
    }
    button {
      padding: 8px 12px;
      cursor: pointer;
      white-space: nowrap;
      background: #f8fafc;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    button.good {
      background: var(--accent-2);
      color: #fff;
      border-color: var(--accent-2);
    }
    button.danger {
      background: #fff;
      color: var(--danger);
      border-color: #efc0c0;
    }
    button:disabled {
      opacity: 0.72;
      cursor: wait;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .checks {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text);
    }
    .check input {
      width: auto;
      margin: 0;
    }
    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      border: 1px solid var(--line);
      background: #f8fafc;
      padding: 6px 8px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fafc;
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
    }
    .status::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.2;
      flex: 0 0 auto;
    }
    .status[data-tone="loading"] {
      background: #eef4ff;
      border-color: #c8d8ff;
      color: var(--accent);
    }
    .status[data-tone="loading"]::before {
      background: transparent;
      border: 2px solid currentColor;
      border-right-color: transparent;
      opacity: 1;
      animation: spin 0.75s linear infinite;
    }
    .status[data-tone="success"] {
      background: #eefaf3;
      border-color: #cdebd8;
      color: var(--accent-2);
    }
    .status[data-tone="error"] {
      background: #fff2f2;
      border-color: #f2c4c4;
      color: var(--danger);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    pre {
      margin: 0;
      padding: 12px;
      min-height: 220px;
      background: #0f172a;
      color: #d7e1ff;
      border-radius: 4px;
      overflow: auto;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .subtle {
      font-size: 12px;
      color: var(--muted);
    }
    .panel-heading {
      display: grid;
      gap: 2px;
      margin-right: auto;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 650;
    }
    .history-list {
      display: grid;
      border-top: 1px solid var(--line);
      min-height: 180px;
    }
    .history-item {
      display: grid;
      gap: 7px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }
    .history-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .history-meta strong {
      color: var(--text);
      font-weight: 650;
    }
    .history-prompt {
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .history-url {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
      overflow-wrap: anywhere;
      text-decoration: none;
    }
    .history-url:hover {
      text-decoration: underline;
    }
    .history-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .history-actions a,
    .history-actions button {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #f8fafc;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
    }
    .empty {
      padding: 18px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .spacer {
      height: 8px;
    }
    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Seedance 视频调试台</h1>
  </header>

  <main>
    <section>
      <div class="stack">
        <div class="grid-2">
          <div class="field">
            <label for="apiKey">API 密钥</label>
            <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
          </div>
          <div class="field">
            <label for="model">模型名称</label>
            <input id="model" type="text" value="doubao-seedance-2-0-fast-260128" spellcheck="false">
          </div>
        </div>

        <div class="row">
          <button id="refreshHistory">刷新历史</button>
          <button id="generate" class="primary">生成</button>
          <button id="poll" class="good">轮询</button>
          <button id="clear" class="danger">清空</button>
        </div>

        <div class="status" id="status" aria-live="polite">就绪</div>

        <div class="grid-2">
          <div class="field">
            <label for="prompt">提示词</label>
            <textarea id="prompt" spellcheck="false">一个红色立方体在白色桌面上缓慢旋转，柔和棚拍光照。</textarea>
          </div>
          <div class="stack">
            <div class="grid-2">
              <div class="field">
                <label for="duration">时长（秒）</label>
                <input id="duration" type="number" min="1" step="1" value="5">
              </div>
              <div class="field">
                <label for="resolution">分辨率</label>
                <select id="resolution">
                  <option value="" selected>自动</option>
                  <option value="480P">480P</option>
                  <option value="720P">720P</option>
                  <option value="1080P">1080P</option>
                </select>
              </div>
            </div>
            <div class="checks">
              <label class="check"><input id="promptExtend" type="checkbox" checked> 启用提示词扩写</label>
            </div>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="taskId">任务编号</label>
            <input id="taskId" type="text" placeholder="task_...">
          </div>
          <div class="field">
            <label for="interval">轮询间隔（毫秒）</label>
            <input id="interval" type="number" min="500" step="100" value="5000">
          </div>
        </div>
        <div class="field">
          <label for="output">输出</label>
          <pre id="output">{}</pre>
        </div>
      </div>
    </section>

    <section>
      <div class="stack">
        <div class="row">
          <div class="panel-heading">
            <div class="panel-title">历史视频地址</div>
            <div class="subtle" id="historyCount">0 条记录</div>
          </div>
          <button id="clearHistory" class="danger">清空历史</button>
        </div>
        <div class="history-list" id="history"></div>
      </div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const output = $('output');
    const statusEl = $('status');
    const modelInput = $('model');
    const taskIdInput = $('taskId');
    const DEFAULT_API_KEY = 'sk-IGDGy9Eb6B9JBioe39Ea0d266f7449508e7d142c955579E4';
    const LEGACY_API_KEYS = new Set(['sk-G3nVNlClE2R9vtsl8eCaDd121c7d44469fCd53Ec52A38aD8']);
    const TERMINAL_STATUSES = new Set(['completed', 'succeeded', 'failed', 'cancelled', 'canceled', 'expired']);
    const STATUS_LABELS = {
      completed: '完成',
      succeeded: '完成',
      failed: '失败',
      cancelled: '已取消',
      expired: '已过期',
    };
    let pollTimer = null;
    let pollActive = false;

    const storedApiKey = (localStorage.getItem('seedance_api_key') || '').trim();
    $('apiKey').value = storedApiKey && !LEGACY_API_KEYS.has(storedApiKey) ? storedApiKey : DEFAULT_API_KEY;
    if (!storedApiKey || LEGACY_API_KEYS.has(storedApiKey)) {
      localStorage.setItem('seedance_api_key', DEFAULT_API_KEY);
    }
    $('apiKey').addEventListener('input', () => {
      localStorage.setItem('seedance_api_key', $('apiKey').value.trim());
    });

    function setOutput(value) {
      output.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
    }

    function setStatus(message, tone = '') {
      statusEl.textContent = message;
      statusEl.dataset.tone = tone;
    }

    function setBusy(button, busyText, busy) {
      if (busy) {
        if (!button.dataset.text) {
          button.dataset.text = button.textContent;
        }
        button.disabled = true;
        button.textContent = busyText;
        button.dataset.busy = '1';
        return;
      }

      button.disabled = false;
      if (button.dataset.text) {
        button.textContent = button.dataset.text;
        delete button.dataset.text;
      }
      delete button.dataset.busy;
    }

    function stopPolling() {
      if (pollTimer) {
        clearTimeout(pollTimer);
        pollTimer = null;
      }
      pollActive = false;
      setBusy($('poll'), '轮询中…', false);
    }

    function prettyError(response) {
      const error = response && response.error;
      if (error && typeof error === 'object') {
        const title = error.title || '请求失败';
        const message = error.message || '上游接口返回错误。';
        const rid = error.request_id ? `（请求 ID：${error.request_id}）` : '';
        return `${title}：${message}${rid}`;
      }
      if (response && response.ok === false && response.status) {
        return `请求失败（HTTP ${response.status}）`;
      }
      return '';
    }

    function applyResponseFeedback(response, successText) {
      const envelope = response?.data ?? response;
      if (envelope && typeof envelope === 'object' && envelope.error) {
        setOutput({
          状态: '失败',
          概要: prettyError(envelope) || '请求失败',
          状态码: envelope.status ?? response?.status ?? '',
          上游地址: envelope.upstreamUrl || '',
          错误详情: envelope.error,
          原始返回: envelope.raw || '',
        });
      } else {
        setOutput(envelope);
      }
      const summary = prettyError(envelope) || prettyError(response);
      if (summary) {
        setStatus(summary, 'error');
      } else if (successText) {
        setStatus(successText, 'success');
      } else {
        setStatus('完成', 'success');
      }
    }

    function extractTaskStatus(task) {
      if (!task || typeof task !== 'object') return '';
      return String(
        task.status
        || task.task_status
        || task.result?.data?.status
        || task.output?.task_status
        || task.output?.status
        || ''
      ).toLowerCase();
    }

    function extractVideoUrl(task) {
      if (!task || typeof task !== 'object') return '';
      return task.result_url
        || task.video_url
        || task.result?.data?.content?.video_url
        || task.output?.video_url
        || task.output?.videoUrl
        || task.output?.url
        || '';
    }

    function buildPayload() {
      return {
        apiKey: $('apiKey').value.trim(),
        model: modelInput.value.trim(),
        prompt: $('prompt').value.trim(),
        duration: Number($('duration').value || 0) || 5,
        metadata: {
          parameters: {
            resolution: $('resolution').value || '720P',
            prompt_extend: $('promptExtend').checked,
          },
        },
      };
    }

    async function requestJson(url, options = {}) {
      const res = await fetch(url, options);
      const text = await res.text();
      let data = text;
      try { data = JSON.parse(text); } catch {}
      return { status: res.status, ok: res.ok, data };
    }

    async function postJson(url, body) {
      return requestJson(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    }

    async function deleteJson(url) {
      return requestJson(url, { method: 'DELETE' });
    }

    function formatDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('zh-CN', { hour12: false });
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
    }

    function renderHistory(items) {
      const list = Array.isArray(items) ? items : [];
      const historyEl = $('history');
      historyEl.innerHTML = '';
      $('historyCount').textContent = `${list.length} 条记录`;

      if (!list.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = '暂无历史视频地址';
        historyEl.appendChild(empty);
        return;
      }

      list.forEach(item => {
        const row = document.createElement('div');
        row.className = 'history-item';

        const meta = document.createElement('div');
        meta.className = 'history-meta';
        const task = document.createElement('strong');
        task.textContent = item.id || '未知任务';
        meta.appendChild(task);

        [
          STATUS_LABELS[item.status] || item.status || '',
          item.model || '',
          item.resolution || '',
          item.duration ? `${item.duration} 秒` : '',
          formatDate(item.finishedAt || item.createdAt || item.savedAt),
        ].filter(Boolean).forEach(text => {
          const span = document.createElement('span');
          span.textContent = text;
          meta.appendChild(span);
        });

        const prompt = document.createElement('div');
        prompt.className = 'history-prompt';
        prompt.textContent = item.prompt ? `提示词：${item.prompt}` : '提示词：未记录';

        const url = document.createElement('a');
        url.className = 'history-url';
        url.href = item.videoUrl || '#';
        url.target = '_blank';
        url.rel = 'noopener noreferrer';
        url.textContent = item.videoUrl || '未返回视频地址';

        const actions = document.createElement('div');
        actions.className = 'history-actions';

        const open = document.createElement('a');
        open.href = item.videoUrl || '#';
        open.target = '_blank';
        open.rel = 'noopener noreferrer';
        open.textContent = '打开视频';
        if (!item.videoUrl) {
          open.setAttribute('aria-disabled', 'true');
        }

        const copy = document.createElement('button');
        copy.type = 'button';
        copy.textContent = '复制地址';
        copy.disabled = !item.videoUrl;
        copy.addEventListener('click', async () => {
          await copyText(item.videoUrl);
          setStatus('已复制视频地址', 'success');
        });

        const fillTask = document.createElement('button');
        fillTask.type = 'button';
        fillTask.textContent = '填入任务';
        fillTask.disabled = !item.id;
        fillTask.addEventListener('click', () => {
          taskIdInput.value = item.id;
          setStatus('已填入任务编号', 'success');
        });

        actions.append(open, copy, fillTask);
        row.append(meta, prompt, url, actions);
        historyEl.appendChild(row);
      });
    }

    async function loadHistory(options = {}) {
      const silent = options.silent === true;
      if (!silent) {
        setBusy($('refreshHistory'), '刷新中…', true);
        setStatus('正在刷新历史记录…', 'loading');
      }
      try {
        const response = await requestJson('/api/history');
        if (!response.ok || response.data?.ok === false) {
          throw new Error(response.data?.error || `刷新历史失败（HTTP ${response.status}）`);
        }
        renderHistory(response.data?.data);
        if (!silent) {
          setStatus('历史记录已刷新', 'success');
        }
      } catch (err) {
        setOutput({ 错误: err.message || '刷新历史失败' });
        setStatus(err.message || '刷新历史失败', 'error');
      } finally {
        if (!silent) {
          setBusy($('refreshHistory'), '刷新中…', false);
        }
      }
    }

    async function clearHistory() {
      if (!confirm('确定要清空历史视频地址吗？')) return;
      setBusy($('clearHistory'), '清空中…', true);
      setStatus('正在清空历史记录…', 'loading');
      try {
        const response = await deleteJson('/api/history');
        if (!response.ok || response.data?.ok === false) {
          throw new Error(response.data?.error || `清空历史失败（HTTP ${response.status}）`);
        }
        renderHistory([]);
        setStatus('历史记录已清空', 'success');
      } catch (err) {
        setOutput({ 错误: err.message || '清空历史失败' });
        setStatus(err.message || '清空历史失败', 'error');
      } finally {
        setBusy($('clearHistory'), '清空中…', false);
      }
    }

    async function createTask() {
      const payload = buildPayload();
      if (!payload.apiKey) {
        setOutput({ 错误: '缺少 API 密钥' });
        setStatus('缺少 API 密钥', 'error');
        return;
      }
      setBusy($('generate'), '生成中…', true);
      setStatus('正在提交生成任务…', 'loading');
      let response;
      try {
        response = await postJson('/api/generate', payload);
      } catch (err) {
        setOutput({ 错误: err.message || '生成请求失败' });
        setStatus(err.message || '生成请求失败', 'error');
        return;
      } finally {
        setBusy($('generate'), '生成中…', false);
      }
      applyResponseFeedback(response, '任务已提交');
      const id = response.data && response.data.data && (response.data.data.id || response.data.data.task_id || response.data.data.output?.task_id);
      if (id) {
        taskIdInput.value = id;
        setStatus(`任务已创建，ID：${id}，正在轮询状态…`, 'loading');
        await pollTask();
      }
    }

    async function pollTask() {
      const key = $('apiKey').value.trim();
      const id = taskIdInput.value.trim();
      if (!key || !id) {
        setOutput({ 错误: '缺少 API 密钥或任务 ID' });
        setStatus('缺少 API 密钥或任务 ID', 'error');
        return;
      }
      stopPolling();
      pollActive = true;
      setBusy($('poll'), '轮询中…', true);

      const interval = Math.max(500, Number($('interval').value || 5000));
      const tick = async () => {
        if (!pollActive) {
          return;
        }
        setStatus(`正在获取任务状态…（${id}）`, 'loading');
        let response;
        try {
          response = await postJson('/api/task', { apiKey: key, id });
        } catch (err) {
          setOutput({ 错误: err.message || '轮询请求失败' });
          setStatus(err.message || '轮询请求失败', 'error');
          stopPolling();
          return;
        }
        applyResponseFeedback(response, '任务状态已更新');
        const task = response.data && response.data.data;
        const status = extractTaskStatus(task);
        const videoUrl = extractVideoUrl(task);
        if (response.data && response.data.ok === false) {
          stopPolling();
          return;
        }
        if (TERMINAL_STATUSES.has(status)) {
          stopPolling();
          const tone = ['completed', 'succeeded'].includes(status) ? 'success' : 'error';
          const suffix = videoUrl ? `，视频地址已返回` : '';
          if (tone === 'success' && videoUrl) {
            await loadHistory({ silent: true });
          }
          setStatus(`任务已${STATUS_LABELS[status] || '结束'}${suffix}`, tone);
          return;
        }
        if (!pollActive) {
          return;
        }
        pollTimer = setTimeout(tick, interval);
      };

      await tick();
    }

    $('refreshHistory').addEventListener('click', () => loadHistory());
    $('clearHistory').addEventListener('click', clearHistory);
    $('generate').addEventListener('click', createTask);
    $('poll').addEventListener('click', pollTask);
    $('clear').addEventListener('click', () => {
      stopPolling();
      setOutput({});
      setStatus('已清空', 'success');
    });

    setOutput({ 状态: '就绪' });
    setStatus('就绪', 'success');
    loadHistory({ silent: true });
  </script>
</body>
</html>
